version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "Npgsql.*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x only supports TypeScript < 6.1. Remove once a
      # typescript-eslint release accepts TypeScript 7 as a peer dependency.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
