name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build (warnings as errors)
        run: dotnet build -c Release --no-restore

      - name: Check for missing EF Core migrations
        run: dotnet ef migrations has-pending-model-changes -p src/ECommerce.Infrastructure -s src/ECommerce.Api --no-build --configuration Release

      - name: Unit tests
        run: dotnet test --project tests/ECommerce.UnitTests -c Release --no-build --coverage --coverage-settings coverage.settings.xml --coverage-output UnitTests.cobertura.xml

      - name: Integration tests
        run: dotnet test --project tests/ECommerce.IntegrationTests -c Release --no-build --coverage --coverage-settings coverage.settings.xml --coverage-output IntegrationTests.cobertura.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/TestResults/*.cobertura.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test the full stack
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ADMIN_PASSWORD: ci-Admin-password-1
          JWT_SIGNING_KEY: ci-only-signing-key-0123456789abcdefghijklmnop
        run: |
          docker compose up -d --build --wait --wait-timeout 180 db
          docker compose up -d --build api web
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 2
          done
          curl -fsS "http://localhost:8080/api/products?pageSize=1" | grep -q '"totalCount"'
          curl -fsS -X POST http://localhost:8080/api/assistant/chat \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"coffee"}]}' | grep -q '"reply"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
